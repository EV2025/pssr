<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>PSSR — Parcours Socio-Sportif Renforcé</title>
<meta content="Découvrez le Parcours Socio-Sportif Renforcé PSSR et son super cercle interactif." name="description"/>
<link href="https://ev2025.github.io/pssr/" rel="canonical"/>
<meta content="#FFF7FB" name="theme-color"/>
<meta content="light" name="color-scheme"/>
<style>body{margin:0;font-family:Inter,Manrope,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#fff8fc;color:#21112b}img{max-width:100%;height:auto}main{min-height:54vh}.ev36-header{position:sticky;top:0;z-index:5000}</style><link href="./assets/css/v39-complet-coherence-roles.css" rel="stylesheet"/></head>
<body class="pssr-page v27-minimal v30-circle-global home-v30-compact ev39-page" id="accueil">
<main id="main"><section aria-labelledby="pssr-title" class="section-tone-6" id="parcours"><div class="section-wrap" id="pssr-cycle-iso"><h1 class="pssr-title" id="pssr-title">PSSR — Parcours Socio-Sportif Renforcé</h1><p class="sec-sub">Un accompagnement progressif pour remettre le mouvement au cœur du quotidien.</p><div aria-label="Filtrer par phase (Kolb)" class="pssr-toolbar" role="toolbar"><button aria-pressed="false" class="pssr-pill" data-phase="CE">🧪 CE — Expérience concrète</button><button aria-pressed="false" class="pssr-pill" data-phase="RO">🔎 RO — Observation réflexive</button><button aria-pressed="false" class="pssr-pill" data-phase="AC">🧠 AC — Conceptualisation abstraite</button><button aria-pressed="false" class="pssr-pill" data-phase="AE">🚀 AE — Expérimentation active</button><button aria-pressed="false" class="pssr-pill" data-phase="reset">Réinitialiser</button></div><div aria-label="Parcours circulaire" class="pssr-ring" id="ring"></div><div aria-label="Étapes du parcours" class="pssr-legend" id="legend"></div><div class="pssr-panels" id="panels"></div><div class="pssr-actions" id="actions"><button class="pssr-ghost" id="showAllBtn" type="button">Tout afficher</button></div></div></section></main>
<script>
/* Parcours — données + interactions */
window.addEventListener('DOMContentLoaded',function(){
  const root   = document.getElementById('pssr-cycle-iso');
  const ring   = root.querySelector('#ring');
  const legend = root.querySelector('#legend');
  const panels = root.querySelector('#panels');
  const pills  = root.querySelectorAll('.pssr-pill[data-phase]');
  const showAll= root.querySelector('#showAllBtn');
  const actions= root.querySelector('#actions');

  let activeId=null;
  let filterPhase=null;

  const PHASE_OF_STEP = { ARF:'CE', BSS:'RO', PDS:'AC', APA:'AC', CPE:'AE', SRS:'AE' };

  const cand = {
    id:"cand", title:"Apprenant — Modèle filtré D. Kolb", subtitle:"Dépôt & entrée dans le parcours",
    objectif:"Confirmer les besoins, accueillir la personne et planifier l’entrée dans le parcours.",
    contenu:["Présenter le dispositif et recueillir le consentement.","Identifier les besoins, les envies et les freins.","Planifier le démarrage du parcours."],
    acteurs:["Référent social","Référent EV"]
  };

  const steps = [
    { idx:1, code:"ARF", title:"Ateliers de Remise en Forme", subtitle:"Sensibiliser, informer, mise en mouvement.", phases:["AC","RO"],
      objectif:"Allumer l’étincelle : comprendre les enjeux et bouger en douceur.",
      contenu:["Présentation du programme et de ses bénéfices.","Éveil à l’activité physique.","Notions clés santé/mouvement.","Exercices de mise en action.","Échanges pour cerner besoins & attentes."],
      acteurs:["Coordinateur EV","Formateur","Coach, Clubs","Intervenant pédagogique externe"] },
    { idx:2, code:"BSS", title:"Bilan Socio-Sportif", subtitle:"Comprendre les besoins pour adapter l’accompagnement.", phases:["RO","AC"],
      objectif:"Dresser un état des lieux personnalisé pour mieux orienter la suite.",
      contenu:["Évaluation état de santé & niveau d’activité.","Freins et motivations.","Tests physiques adaptés.","Plan individuel de reprise."],
      acteurs:["Référent EV","Coach socio-sportif","Référent psycho-social","Médecin du sport"] },
    { idx:3, code:"PDS", title:"Parcours Découverte Sportive", subtitle:"Tester des disciplines avec les partenaires.", phases:["CE","RO"],
      objectif:"Explorer, essayer, ressentir : trouver l’activité qui te convient.",
      contenu:["Mise en relation avec des structures locales.","Séances d’essai dans divers clubs partenaires.","Découverte de disciplines variées.","Coordination & retours d’expérience."],
      acteurs:["Coordinateur EV","Clubs partenaires","Coach socio-sportif"] },
    { idx:4, code:"APA", title:"Activité Physique Adaptée", subtitle:"Pratique régulière et progressive.", phases:["AE","CE"],
      objectif:"Installer une routine sécurisée et motivante.",
      contenu:["Choix de l’activité selon profils & envies.","Adaptation des séances.","Suivi régulier et encouragements.","Valorisation des progrès."],
      acteurs:["Travailleurs sociaux","Professionnels de la santé","Intervenants socio-sportifs"] },
    { idx:5, code:"CPE", title:"Concertation Partagée d’Engagement", subtitle:"Avancer ensemble.", phases:["RO","AC"],
      objectif:"Coordonner les services et lever les obstacles.",
      contenu:["Lien sport/santé/social.","Relais vers les dispositifs utiles.","Partage d’informations & suivi.","Actions conjointes ciblées."],
      acteurs:["Référent EV","Partenaire emploi","Professionnel du social"] },
    { idx:6, code:"SRS", title:"Suivi Renforcé Solution", subtitle:"Maintenir une pratique durable.", phases:["AE","RO"],
      objectif:"Pérenniser l’activité physique choisie, dans la durée.",
      contenu:["Suivi après intégration dans une pratique régulière.","Soutien à la persévérance.","Ajustements au fil du temps.","Un cadre pour durer","Opportunités créatives et transversales"],
      acteurs:["Référent EV","Structures sportives","Mentor","Conseiller emploi","Travailleurs sociaux"] }
  ];

  const STEP_COLORS={1:{v:'var(--s1)'},2:{v:'var(--s2)'},3:{v:'var(--s3)'},4:{v:'var(--s4)'},5:{v:'var(--s5)'},6:{v:'var(--s6)'}};

  function panelTpl(id, title, sub, obj, list, actors, phases, accent, phase){
    const tags=(phases||[]).map(p=>`<span class="pssr-tag">${p}</span>`).join("");
    const items=(list||[]).map(li=>`<li>${li}</li>`).join("");
    const actorsArr = Array.isArray(actors) ? actors : (String(actors||'').split(/\s*,\s*|\n+/).filter(Boolean));
    const actorsHtml = actorsArr.length ? `<ul class="actors-list" style="list-style:none;margin:0;padding:0">${actorsArr.map(a=>`<li>${a}</li>`).join('')}</ul>` : `<p style="margin:0;">—</p>`;
    return `
      <div class="pssr-panel" id="pssr-panel-${id}" data-step="${id}" data-phase="${phase||''}" style="--accent:${accent}" aria-hidden="true">
        <button class="btn-appel-ghost" type="button" data-back style="position:absolute; right:12px; top:12px; padding:8px 12px; min-height:36px">Contenu</button>
        <h3>${title}</h3>
        <div class="pssr-meta">
          ${sub?`<span class="pssr-tag">${sub}</span>`:""}
          ${tags}
        </div>
        <div class="pssr-cols">
          <div class="pssr-box"><h5>Objectif</h5><p style="margin:0;color:var(--ink)">${obj||""}</p></div>
          <div class="pssr-box"><h5>Contenu</h5><ul style="margin:6px 0 0 18px;padding:0">${items}</ul></div>
          <div class="pssr-box"><h5>Acteurs principaux</h5>${actorsHtml}</div>
        </div>
      </div>`;
  }

  function buildPanels(){
    panels.replaceChildren();
    panels.insertAdjacentHTML('beforeend', panelTpl(cand.id, cand.title, cand.subtitle, cand.objectif, cand.contenu, cand.acteurs, [], 'var(--l500)', ''));
    steps.forEach(s=>{
      const accent = STEP_COLORS[s.idx].v;
      const phase  = PHASE_OF_STEP[s.code];
      panels.insertAdjacentHTML('beforeend', panelTpl(String(s.idx), `${s.idx}. ${s.code} — ${s.title}`, s.subtitle, s.objectif, s.contenu, s.acteurs, s.phases, accent, phase));
    });
    panels.querySelectorAll('[data-back]').forEach(b=>b.addEventListener('click',showAllFn));
  }

  function buildLegend(){
    legend.innerHTML="";
    const c=document.createElement('div');
    c.className="pssr-card"; c.dataset.step=cand.id; c.style.setProperty('--accent','var(--l500)');
    c.tabIndex=0; c.role='button'; c.setAttribute('aria-label','Ouvrir : Apprenant'); c.setAttribute('aria-expanded','false');
    c.innerHTML=`<h4>${cand.title}</h4><p>${cand.subtitle}</p>`;
    c.addEventListener('click',()=>toggleStep(cand.id));
    c.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' ') { e.preventDefault(); toggleStep(cand.id); }});
    legend.appendChild(c);

    steps.forEach(s=>{
      const d=document.createElement('div');
      d.className="pssr-card"; d.dataset.step=s.idx; d.dataset.phase = PHASE_OF_STEP[s.code];
      d.style.setProperty('--accent', STEP_COLORS[s.idx].v);
      d.tabIndex=0; d.role='button'; d.setAttribute('aria-label',`Ouvrir : ${s.idx}. ${s.code} — ${s.title}`); d.setAttribute('aria-expanded','false');
      d.innerHTML=`<h4>${s.idx}. ${s.code} — ${s.title}</h4><p>${s.subtitle}</p>`;
      d.addEventListener('click',()=>toggleStep(String(s.idx)));
      d.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' ') { e.preventDefault(); toggleStep(String(s.idx)); }});
      legend.appendChild(d);
    });
  }

  function placeNodes(){
    ring.innerHTML="";
    const center=document.createElement('button');
    center.type="button"; center.className="pssr-center"; center.dataset.step=cand.id; center.textContent="Apprenant";
    center.setAttribute('aria-label','Apprenant'); center.setAttribute('aria-pressed','false');
    center.addEventListener('click',()=>toggleStep(cand.id));
    center.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' ') { e.preventDefault(); toggleStep(cand.id); }});
    ring.appendChild(center);

    const R=ring.clientWidth/2-22, cx=ring.clientWidth/2, cy=ring.clientHeight/2;
    steps.forEach((s,i)=>{
      const a=(i/steps.length)*Math.PI*2 - Math.PI/2, x=cx+R*Math.cos(a), y=cy+R*Math.sin(a);
      const n=document.createElement('button');
      n.type="button";
      n.className=`pssr-node step-${s.idx}`;
      n.style.setProperty('--accent', STEP_COLORS[s.idx].v);
      n.textContent=s.idx;
      n.dataset.step=s.idx;
      n.dataset.phase = PHASE_OF_STEP[s.code];
      n.style.left=x+"px"; n.style.top=y+"px";
      n.setAttribute('aria-label',`${s.idx}. ${s.code} — ${s.title}`);
      n.setAttribute('aria-pressed','false');
      n.addEventListener('click',()=>toggleStep(String(s.idx)));
      n.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' ') { e.preventDefault(); toggleStep(String(s.idx)); }});
      ring.appendChild(n);
    });
    updateAriaStates();
  }

  function clearActive(){
    ring.querySelectorAll('.pssr-node, .pssr-center').forEach(n=>n.classList.remove('active'));
    panels.querySelectorAll('.pssr-panel').forEach(p=>p.classList.remove('active'));
    legend.querySelectorAll('.pssr-card').forEach(c=>c.classList.remove('active'));
  }

  function updateAriaStates(){
    panels.querySelectorAll('.pssr-panel').forEach(p=>{
      const isActive = p.classList.contains('active');
      p.setAttribute('aria-hidden', isActive ? 'false' : 'true');
    });
    ring.querySelectorAll('.pssr-node, .pssr-center').forEach(el=>{
      const isActive = el.classList.contains('active');
      el.setAttribute('aria-pressed', isActive ? 'true' : 'false');
    });
    legend.querySelectorAll('.pssr-card').forEach(card=>{
      const isActive = card.classList.contains('active');
      card.setAttribute('aria-expanded', isActive ? 'true' : 'false');
    });
  }

  function openStep(id){
    activeId=id; clearActive();
    root.classList.add('pssr-solo');
    actions.style.display='flex';

    ring.querySelector(`[data-step="${id}"]`)?.classList.add('active');
    panels.querySelector(`.pssr-panel[data-step="${id}"]`)?.classList.add('active');
    legend.querySelector(`.pssr-card[data-step="${id}"]`)?.classList.add('active');

    updateAriaStates();

    setTimeout(() => {
      panels.querySelector(`.pssr-panel[data-step="${id}"]`)?.scrollIntoView({behavior:'smooth', block:'nearest'});
    }, 0);
  }

  function toggleStep(id){
    if (activeId === id) {
      showAllFn();
    } else {
      openStep(id);
    }
  }

  function showAllFn(){
    activeId=null; clearActive();
    root.classList.remove('pssr-solo');
    actions.style.display='none';
    panels.querySelectorAll('.pssr-panel').forEach(p=>p.classList.remove('active'));
    filterPhase=null;
    pills.forEach(x=>x.setAttribute('aria-pressed','false'));
    dimByPhase();
    updateAriaStates();
    ring.scrollIntoView({behavior:'smooth', block:'nearest'});
  }
  showAll.addEventListener('click',showAllFn);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && activeId !== null) {
      showAllFn();
    }
  });

  function dimByPhase(){
    const nodes = ring.querySelectorAll('.pssr-node');
    const cards = legend.querySelectorAll('.pssr-card');
    if(!filterPhase){
      nodes.forEach(n=>n.classList.remove('dim'));
      cards.forEach(c=>c.style.opacity="1");
      ring.style.boxShadow = 'var(--ring-shadow)';
      return;
    }
    const halo = getComputedStyle(document.documentElement).getPropertyValue(`--${filterPhase}`).trim() || '#999';
    ring.style.boxShadow = `0 0 0 12px ${halo}22, var(--ring-shadow)`;
    nodes.forEach(n=>n.classList.toggle('dim', n.dataset.phase !== filterPhase));
    cards.forEach(c=>{
      const ok = (c.dataset.phase === filterPhase) || !c.dataset.phase;
      c.style.opacity = ok ? "1" : ".45";
    });
  }

  pills.forEach(p=>{
    p.addEventListener('click',()=>{
      const ph=p.dataset.phase;
      if(ph==="reset"){
        filterPhase=null;
        pills.forEach(x=>x.setAttribute('aria-pressed','false'));
        dimByPhase();
        panels.scrollIntoView({behavior:'smooth',block:'nearest'});
        return;
      }
      const isPressed = p.getAttribute('aria-pressed')==='true';
      pills.forEach(x=>x.setAttribute('aria-pressed','false'));
      filterPhase = isPressed ? null : ph;
      if(!isPressed) p.setAttribute('aria-pressed','true');
      if(root.classList.contains('pssr-solo')){ showAllFn(); }
      dimByPhase();
      ring.scrollIntoView({behavior:'smooth',block:'nearest'});
    });
  });

  buildPanels(); buildLegend(); placeNodes();
  dimByPhase();

  const ro = new ResizeObserver(placeNodes);
  ro.observe(ring);
  addEventListener('orientationchange', placeNodes, {passive:true});
  addEventListener('resize', placeNodes, {passive:true});
});
</script><script defer="True" src="./assets/js/v39-complet-coherence-roles.js"></script></body>
</html>
