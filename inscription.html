<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>Inscription PSSR — Équilibre Vital</title>
<meta content="Inscription rapide au PSSR : activité choisie, coordonnées et création d’espace membre." name="description"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&amp;family=Manrope:wght@400;600;800&amp;display=swap" rel="stylesheet"/>
<link href="./assets/css/stable-v24.css" rel="stylesheet"/>
<link href="./assets/css/v26-jekyll-ux.css" rel="stylesheet"/><link href="./assets/css/v27-minimaliste.css" rel="stylesheet"/><link href="./assets/css/v28-apple-minimal.css" rel="stylesheet"/>
<link href="./assets/css/v29-circle-language.css" rel="stylesheet"/>
<link href="./assets/css/v30-circle-global.css" rel="stylesheet"/><meta content="#FFF7FB" name="theme-color"/>
<meta content="light" name="color-scheme"/>
<link href="assets/css/v31-best-settings.css" rel="stylesheet"/>
<link href="./assets/css/v35-v33-sections-liens-titres.css" rel="stylesheet"/></head>
<body class="pssr-page v30-circle-global ev35-page">
<main class="pssr-main" id="main">
<section class="panel auth-box inscription-v14">
<p class="eyebrow">Inscription rapide</p>
<h1>Créer mon espace membre</h1>
<p class="intro">Quelques informations suffisent pour commencer. L’équipe vous recontacte ensuite pour finaliser les détails.</p>
<form class="form-grid compact-form form-v14" id="register-form">
<div class="form-step-title full">
<span class="step-kicker">Étape 1</span>
<h2>Informations personnelles</h2>
<p>Renseignez vos informations de base pour créer votre dossier d’inscription.</p>
</div>
<label class="field-v14">Prénom <span aria-hidden="true" class="req">*</span>
<input autocomplete="given-name" name="firstName" placeholder="Votre prénom" required=""/>
</label>
<label class="field-v14">Nom <span aria-hidden="true" class="req">*</span>
<input autocomplete="family-name" name="lastName" placeholder="Votre nom" required=""/>
</label>
<label class="field-v14">Email <span aria-hidden="true" class="req">*</span>
<input autocomplete="email" name="email" placeholder="exemple@email.com" required="" type="email"/>
</label>
<label class="field-v14">Mot de passe <span aria-hidden="true" class="req">*</span>
<input autocomplete="new-password" minlength="6" name="password" placeholder="Minimum 6 caractères" required="" type="password"/>
</label>
<label class="field-v14">Téléphone <span aria-hidden="true" class="req">*</span>
<input autocomplete="tel" name="phone" placeholder="Votre numéro de téléphone" required="" type="tel"/>
</label>
<label class="field-v14">Date de naissance <span aria-hidden="true" class="req">*</span>
<input autocomplete="bday" name="birthDate" required="" type="date"/>
</label>
<label class="field-v14 full">Adresse <span aria-hidden="true" class="req">*</span>
<input autocomplete="street-address" name="address" placeholder="Votre adresse complète" required=""/>
</label>
<input name="modules" type="hidden" value=""/>
<label class="full consent consent-v14"><input name="rgpdConsent" required="" type="checkbox"/> <span>J’accepte les conditions et la <a href="./confidentialite-rgpd.html" rel="noopener" target="_blank">politique de confidentialité</a>.</span></label>
<button class="btn btn-v14-submit" type="submit">Créer mon espace membre</button>
<p class="msg" hidden="" id="register-msg"></p>
</form>
</section>
</main>
<script>
/* V5 — préremplissage inscription depuis les modules sélectionnés */
(function(){
  const params = new URLSearchParams(location.search);
  const modules = params.get('modules') || params.get('module') || '';
  const field = document.querySelector('[name="modules"]');
  if(field && modules) field.value = modules.replace(/\s*,\s*/g, ', ');
})();
</script>
<script src="./assets/js/register.js" type="module"></script>
<script defer="" src="./assets/js/media-fallback.js"></script>

<script defer="True" src="./assets/js/v35-v33-sections-liens-titres.js"></script></body></html>
