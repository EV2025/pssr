<body class="pssr-page v30-circle-global ev39-page">
<main class="pssr-main" id="main">
<section class="panel">
<p class="eyebrow">Réservation</p>
<h1>Réservation PSSR</h1>
<p>Complétez votre demande de réservation. L’équipe PSSR vérifie les disponibilités et vous recontacte pour confirmer l’inscription.</p>
<form class="form-grid" data-firebase-collection="reservations" id="reservation-form">
<label>Nom complet<input name="nom" placeholder="Prénom Nom" required=""/></label>
<label>Email<input name="email" placeholder="exemple@domaine.be" required="" type="email"/></label>
<label>Téléphone<input name="tel" placeholder="0492 691 070" type="tel"/></label>
<label>Objectif principal<select name="objectif"><option value="">Choisir un objectif</option><option>Remise en forme</option><option>Découverte sportive</option><option>Bien-être / santé</option><option>Accompagnement socio-professionnel</option><option>Enfant / adolescent</option></select></label>
<label>Activité ou module souhaité<select name="creneau" required="">
<option value="">Choisir un créneau</option>
<optgroup label="Activités sportives officielles">
<option>Mardi 18:00–19:00 — Cardio Fit Ados — 13–17 ans</option>
<option>Mardi 19:00–20:00 — Initiation Boxe &amp; Kick-Boxing — 13 ans+</option>
<option>Vendredi 16:00–17:00 — Kids Move — 6–12 ans</option>
<option>Vendredi 17:00–18:00 — Training Jeunes — Multisport — 13–17 ans</option>
<option>Vendredi 19:00–20:00 — Fitness Loisirs Mixte — 18 ans+</option>
<option>Vendredi 20:00–21:00 — Boxing Loisir &amp; Technique — 18 ans+</option>
<option>Samedi 08:00–10:00 — Mobility &amp; Recovery — 40 ans+</option>
</optgroup>
<optgroup label="Accompagnement socio-professionnel PSSR">
<option>Coaching individuel</option>
<option>Employabilité</option>
<option>Création et mise à jour du CV</option>
<option>Recherche d’emploi</option>
<option>Simulations d’entretien</option>
<option>Développement personnel</option>
<option>Gestion du stress</option>
<option>Nutrition et bien-être</option>
<option>Orientation vers la formation</option>
<option>Orientation professionnelle</option>
<option>Accompagnement administratif</option>
<option>Coaching motivationnel</option>
</optgroup>
</select></label>
<label class="full">Modules sélectionnés<textarea name="modules" placeholder="Si vous avez choisi plusieurs modules, ils apparaîtront ici." rows="2"></textarea></label>
<label class="full">Message<textarea name="message" placeholder="Âge, disponibilité, question éventuelle…" rows="4"></textarea></label>
<label class="full consent"><input name="rgpdConsent" required="" type="checkbox"/> <span>J’accepte que mes données soient utilisées pour traiter ma demande de réservation. <a href="./confidentialite-rgpd.html" rel="noopener" target="_blank">Voir la politique de confidentialité</a>.</span></label>
<input aria-hidden="true" autocomplete="off" class="hp" name="website" tabindex="-1" type="text"/>
<button class="btn" type="submit">Envoyer la demande</button>
<p class="msg" hidden="" id="reservation-msg"></p>
<p class="msg-note">Le paiement en ligne n'est pas activé dans cette version ; l'équipe confirme les modalités après validation.</p>
</form>
</section>
</main>
<script>
/* V5 — préremplissage réservation depuis les modules sélectionnés */
(function(){
  const params = new URLSearchParams(location.search);
  const modules = params.get('modules') || params.get('module') || '';
  if(!modules) return;
  const decoded = modules.replace(/\s*,\s*/g, ', ');
  const form = document.getElementById('reservation-form');
  const select = form?.elements?.creneau;
  const modulesField = form?.elements?.modules;
  if(modulesField) modulesField.value = decoded;
  if(select){
    const first = decoded.split(',')[0].trim();
    const options = Array.from(select.options);
    const found = options.find(o => o.textContent.includes(first) || first.includes(o.textContent));
    if(found) select.value = found.value;
    else {
      const opt = new Option(first, first, true, true);
      select.add(opt);
    }
  }
})();
</script>
